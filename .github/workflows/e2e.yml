name: Live agent run (real APIs)

# Runs the real multi-agent system against live LLMs and APIs using the repository secrets,
# and uploads the execution trace as a build artifact. Trigger it manually from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      request:
        description: "Sample request file"
        default: "samples/request_1_evening_conflict.json"
      replan:
        description: "Optional replan event, e.g. 'weather|Heavy rain started' (leave empty to skip)"
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      OSM_CONTACT: lifeplan-ai github actions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check keys
        run: python scripts/check_keys.py
      - name: Run agents
        env:
          REQ: ${{ inputs.request }}
          EV: ${{ inputs.replan }}
        run: |
          if [ -n "$EV" ]; then
            python scripts/run_demo.py "$REQ" --out out --replan "${EV%%|*}" "${EV#*|}"
          else
            python scripts/run_demo.py "$REQ" --out out
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-trace
          path: out/
