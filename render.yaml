# Render Blueprint — https://render.com/docs/blueprint-spec
# New -> Blueprint -> pick this repo. Render asks for the secret values marked sync: false.
services:
  - type: web
    name: lifeplan-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn lifeplan.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: PRIMARY_LLM_PROVIDER
        value: groq
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: OSM_CONTACT
        value: lifeplan-ai (github.com/yashpatelSIT/lifeplan-ai)
